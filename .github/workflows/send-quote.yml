name: Send weekly quote

on:
  schedule:
    - cron: "30 7 * * *" 
  workflow_dispatch:         # manual button for testing

jobs:
  send_quote:
    runs-on: ubuntu-latest
    environment: automations_python
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send the quote
        env:
          MY_MAIL: ${{ secrets.MY_MAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        working-directory: motivational_mails
        run: python main.py
